# Builds the game and uploads it to itch.io (HTML5 channel) on every push to main.
#
# Uploads to https://bennjam.itch.io/stormcam. Needs the repository secret
# BUTLER_API_KEY (an itch.io API key: itch.io → Settings → API keys).
# The ITCH_USER / ITCH_GAME repository variables can override the target.
name: Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch
  cancel-in-progress: true

jobs:
  itch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # butler is itch.io's own uploader, downloaded from itch.io itself.
      - name: Install butler
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V
      - name: Push dist/ to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler/butler push dist "${{ vars.ITCH_USER || 'bennjam' }}/${{ vars.ITCH_GAME || 'stormcam' }}:html5" --userversion "${{ github.sha }}"
